name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Cache Flutter dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            build/
          key: flutter-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-pub-

      - name: Install Flutter dependencies
        run: flutter pub get

      # ===== FIX iOS DEPLOYMENT TARGET TO 15.0 =====
      - name: Set iOS deployment target to 15.0 in Podfile
        run: |
          cd ios
          if grep -q "^platform :ios," Podfile; then
            sed -i '' 's/^platform :ios, .*/platform :ios, "15.0"/' Podfile
          else
            echo 'platform :ios, "15.0"' | cat - Podfile > tmp && mv tmp Podfile
          fi
          cat Podfile

      - name: Set iOS deployment target to 15.0 in Xcode project
        run: |
          # Update all occurrences of IPHONEOS_DEPLOYMENT_TARGET to 15.0
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]\+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' {} \;
          # Also explicitly set for the Runner target (in case of multiple targets)
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]\+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' {} \;

      - name: Verify deployment target
        run: |
          echo "Checking Podfile platform:"
          grep "^platform :ios," ios/Podfile || echo "Platform line not found"
          echo "Checking project.pbxproj for IPHONEOS_DEPLOYMENT_TARGET:"
          grep "IPHONEOS_DEPLOYMENT_TARGET" ios/Runner.xcodeproj/project.pbxproj | head -5

      # ===== BUILD =====
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
        env:
          COCOAPODS_DISABLE_STATS: true

      - name: Build iOS release IPA (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Prepare IPA structure
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/

      - name: Zip into IPA
        run: |
          cd build/ios/iphoneos
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"
