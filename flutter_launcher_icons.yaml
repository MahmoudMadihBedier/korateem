flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/koraa_icon_48x48.png"
  min_sdk_android: 21 # android min sdk min values
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/koraa_icon_48x48.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  windows:
    generate: true
    image_path: "assets/images/koraa_icon_48x48.png"
    icon_size: 48 # min is 48, max is 256, should be power of 2.

  macos:
    generate: true
    image_path: "assets/images/koraa_icon_48x48.png"
